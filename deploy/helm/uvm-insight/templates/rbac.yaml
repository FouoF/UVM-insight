apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uvm-insight.fullname" . }}
  labels:
    {{- include "uvm-insight.labels" . | nindent 4 }}
---
# Pod names for the pod UIDs that collectors report. Each exporter lists only
# the pods on its own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uvm-insight.fullname" . }}
  labels:
    {{- include "uvm-insight.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uvm-insight.fullname" . }}
  labels:
    {{- include "uvm-insight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uvm-insight.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uvm-insight.fullname" . }}
    namespace: {{ .Release.Namespace }}
