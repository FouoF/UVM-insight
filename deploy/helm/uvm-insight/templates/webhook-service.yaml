{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uvm-insight.fullname" . }}-webhook
  namespace: {{ include "uvm-insight.namespace" . }}
  labels:
    {{- include "uvm-insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selector:
    {{- include "uvm-insight.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  ports:
    - name: https
      port: 443
      targetPort: https
{{- end }}
