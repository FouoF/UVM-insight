apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "uvm-insight.fullname" . }}
  namespace: {{ include "uvm-insight.namespace" . }}
  labels:
    {{- include "uvm-insight.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "uvm-insight.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # The socket path is fixed per node, so the old pod has to exit first.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        {{- include "uvm-insight.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "uvm-insight.fullname" . }}
      hostPID: {{ .Values.hostPID }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install-collector
          image: {{ include "uvm-insight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["install", "--src", "/opt/uvm-insight/lib", "--dst", "/host/lib"]
          volumeMounts:
            - name: host-dir
              mountPath: /host
      containers:
        - name: exporter
          image: {{ include "uvm-insight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.service.port }}
            - --socket=/host/agent.sock
            - --retention={{ .Values.retention }}
            - --ui={{ .Values.ui.enabled }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-dir
              mountPath: /host
      volumes:
        - name: host-dir
          hostPath:
            path: {{ .Values.hostDir }}
            type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
