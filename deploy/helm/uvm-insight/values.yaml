image:
  repository: dynamia-ai-registry.cn-hangzhou.cr.aliyuncs.com/artifacts/dynamia-ai/uvm-insight
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Host directory shared with CUDA workloads. The exporter installs the
# collector into <hostDir>/lib and listens on <hostDir>/agent.sock.
# Workloads mount it at the same path inside the container (see NOTES.txt).
hostDir: /var/lib/uvm-insight

# Run in the host pid namespace so the pid label is the host pid, matching
# nvidia-smi and unique across pods on the node.
hostPID: true

# Serve the web UI and JSON API next to /metrics.
ui:
  enabled: false

# How long exited processes keep their series.
retention: 10m

nodeSelector:
  nvidia.com/gpu.present: "true"

tolerations: []
affinity: {}
priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}

service:
  port: 9400
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9400"

serviceMonitor:
  enabled: false
  # Extra labels, e.g. release: prometheus for kube-prometheus-stack.
  labels: {}
  interval: 15s
  scrapeTimeout: 10s
  # Workload namespace/pod/container labels win over the exporter's own target labels.
  honorLabels: true

# Mutating admission webhook that injects CUDA_INJECTION64_PATH, the hostPath
# mount and SYS_ADMIN into matching Pods. The DaemonSet still only installs
# the collector and exports metrics; this webhook is what opts workloads in.
webhook:
  enabled: true
  replicaCount: 1
  # Ignore keeps the cluster usable if the webhook is down.
  failurePolicy: Ignore
  timeoutSeconds: 10
  # Inside the workload container. Defaults to hostDir.
  mountPath: ""
  addSysAdmin: true
  # Inject when a container requests any of these resources.
  gpuResources:
    - nvidia.com/gpu
  # Also inject when the pod has nvidia.com/use-gpuuuid (HAMi / Kantaloupe).
  injectOnHAMi: true
  # Extra namespaces to skip (the release namespace is always skipped).
  ignoreNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  # Optional selectors on the MutatingWebhookConfiguration.
  namespaceSelector: {}
  objectSelector: {}
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
